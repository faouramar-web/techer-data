    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchDesc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                          Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
          if (fetchDesc && (!fetchDesc.writable || (fetchDesc.get && !fetchDesc.set))) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function(val) { originalFetch = val; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}

        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('Cannot set property fetch') !== -1) ||
            (e.error && e.error.stack && e.error.stack.indexOf('chrome-extension://') !== -1)
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (
            e.reason &&
            ((e.reason.message && e.reason.message.indexOf('Cannot set property fetch') !== -1) ||
             (e.reason.stack && e.reason.stack.indexOf('chrome-extension://') !== -1))
          ) {
            e.preventDefault();
          }
        });
      })();
    </script>
